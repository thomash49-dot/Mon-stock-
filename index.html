<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mon Stock" />
  <link rel="manifest" href="manifest.json">
  <title>Mon Stock</title>
  <style>
    :root{
      --bg:#0b1020;--panel:#121a2f;--panel2:#17213b;--text:#f7f8fb;
      --muted:#9ba8c7;--green:#22c55e;--orange:#f59e0b;--red:#ef4444;
      --blue:#2563eb;--border:rgba(255,255,255,.09);--shadow:0 10px 30px rgba(0,0,0,.25)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#0a0f1f,#11192d 65%,#0a1020);color:var(--text);min-height:100vh}
    .wrap{max-width:900px;margin:0 auto;padding:18px 14px 92px}
    .top{position:sticky;top:0;z-index:5;backdrop-filter:blur(16px);
      background:rgba(11,16,32,.78);padding:max(10px,env(safe-area-inset-top)) 0 12px;margin-bottom:12px}
    .head,.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    h1{font-size:25px;margin:0}.sub,.meta{color:var(--muted);font-size:12px}.sub{margin-top:3px}
    .pill{background:rgba(96,165,250,.12);color:#bfdbfe;border:1px solid rgba(96,165,250,.25);
      border-radius:999px;padding:7px 10px;font-weight:700;font-size:12px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
    .stat,.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
    .stat{padding:14px}.stat b{font-size:24px;display:block}.stat span{color:var(--muted);font-size:12px}
    .toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
    .managebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    input,select,button{font:inherit;border-radius:12px;border:1px solid var(--border)}
    input,select{background:var(--panel);color:var(--text);padding:12px;width:100%;outline:none}
    button{background:var(--panel2);color:#fff;padding:11px 14px;cursor:pointer;font-weight:700}
    button.primary{background:var(--blue);border-color:#3b82f6} button.danger{background:#7f1d1d}
    .filters{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}
    .filters button{white-space:nowrap;padding:8px 11px;font-size:13px}.filters button.active{background:var(--blue)}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
    .section-title h2{font-size:17px;margin:0}.list{display:grid;gap:9px}.card{padding:13px}
    .name{font-weight:800;font-size:16px}.qty{font-weight:900;font-size:18px;white-space:nowrap}
    .status{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}
    .ok{color:#bbf7d0;background:rgba(34,197,94,.13)}
    .low{color:#fde68a;background:rgba(245,158,11,.13)}
    .critical{color:#fecaca;background:rgba(239,68,68,.13)}
    .actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}
    .empty{text-align:center;color:var(--muted);padding:32px 8px}
    .fab{position:fixed;right:18px;bottom:max(18px,env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;
      background:var(--blue);border:0;font-size:28px;box-shadow:0 12px 30px rgba(37,99,235,.45)}
    dialog{border:1px solid var(--border);background:#10182b;color:#fff;border-radius:18px;width:min(92vw,520px);
      padding:0;box-shadow:0 20px 70px rgba(0,0,0,.5)}
    dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
    .modal{padding:16px}.modal h3{margin:0 0 14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.field{margin-bottom:10px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
    .reorder-box{background:linear-gradient(135deg,rgba(239,68,68,.12),rgba(245,158,11,.08));
      border:1px solid rgba(239,68,68,.23);border-radius:16px;padding:12px;margin:12px 0}
    .reorder-box strong{display:block;margin-bottom:4px}
    @media(max-width:600px){
      .stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}
      .grid2{grid-template-columns:1fr}.managebar{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="head">
      <div><h1>Mon Stock</h1><div class="sub">Inventaire & réapprovisionnement</div></div>
      <div class="pill" id="alertPill">0 alerte</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="totalProducts">0</b><span>Produits</span></div>
    <div class="stat"><b id="lowCount">0</b><span>À recommander</span></div>
    <div class="stat"><b id="totalUnits">0</b><span>Unités en stock</span></div>
  </div>

  <div class="reorder-box" id="reorderBox" style="display:none">
    <strong>Réapprovisionnement nécessaire</strong><div id="reorderText" class="sub"></div>
  </div>

  <div class="toolbar">
    <input id="search" placeholder="Rechercher un produit…" />
    <button id="exportBtn">Exporter</button>
  </div>

  <div class="managebar">
    <button id="manageCategories">⚙️ Gérer les catégories</button>
    <button id="manageUnits">⚙️ Gérer les unités</button>
  </div>

  <div class="filters" id="filters"></div>

  <div class="section-title">
    <h2>Stock actuel</h2><button id="showReorder">Voir à commander</button>
  </div>
  <div class="list" id="productList"></div>
</div>

<button class="fab" id="addBtn" aria-label="Ajouter">+</button>

<dialog id="categoryDialog">
  <div class="modal">
    <h3>Gérer les catégories</h3>
    <div class="field">
      <label>Ajouter une catégorie</label>
      <div style="display:grid;grid-template-columns:1fr auto;gap:8px">
        <input id="newCategoryName" placeholder="Ex. Produits frais">
        <button class="primary" id="addCategoryBtn" type="button">Ajouter</button>
      </div>
    </div>
    <div class="list" id="categoryList"></div>
    <div class="modal-actions"><button id="closeCategoryDialog" type="button">Fermer</button></div>
  </div>
</dialog>

<dialog id="unitDialog">
  <div class="modal">
    <h3>Gérer les unités</h3>
    <div class="field">
      <label>Ajouter une unité</label>
      <div style="display:grid;grid-template-columns:1fr auto;gap:8px">
        <input id="newUnitName" placeholder="Ex. fût">
        <button class="primary" id="addUnitBtn" type="button">Ajouter</button>
      </div>
    </div>
    <div class="list" id="unitList"></div>
    <div class="modal-actions"><button id="closeUnitDialog" type="button">Fermer</button></div>
  </div>
</dialog>

<dialog id="productDialog">
  <form method="dialog" id="productForm" class="modal">
    <h3 id="dialogTitle">Ajouter un produit</h3>
    <input type="hidden" id="editId">
    <div class="field"><label>Nom</label><input id="name" required placeholder="Ex. Eau pétillante"></div>
    <div class="grid2">
      <div class="field"><label>Catégorie</label><select id="category"></select></div>
      <div class="field"><label>Unité</label><select id="unit"></select></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Quantité actuelle</label><input id="qty" type="number" min="0" step="0.1" value="0" required></div>
      <div class="field"><label>Seuil d'alerte</label><input id="threshold" type="number" min="0" step="0.1" value="3" required></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Quantité idéale</label><input id="target" type="number" min="0" step="0.1" value="10" required></div>
      <div class="field"><label>Fournisseur</label><input id="supplier" placeholder="Optionnel"></div>
    </div>
    <div class="modal-actions">
      <button type="button" id="cancelBtn">Annuler</button>
      <button class="primary" type="submit">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
const DEFAULT_PRODUCTS=[
  {id:crypto.randomUUID(),name:"Eau pétillante",category:"Softs",unit:"bouteille",qty:12,threshold:6,target:24,supplier:""},
  {id:crypto.randomUUID(),name:"Cola",category:"Softs",unit:"bouteille",qty:4,threshold:6,target:18,supplier:""},
  {id:crypto.randomUUID(),name:"Jus d'orange",category:"Jus",unit:"bouteille",qty:2,threshold:3,target:8,supplier:""},
  {id:crypto.randomUUID(),name:"Serviettes",category:"Consommables",unit:"paquet",qty:7,threshold:2,target:10,supplier:""}
];
const DEFAULT_CATEGORIES=["Softs","Jus","Sirop","Consommables","Autre"];
const DEFAULT_UNITS=["bouteille","canette","carton","pièce","litre","paquet","fût"];

let products=JSON.parse(localStorage.getItem("stock_products_v1")||"null");
if(!Array.isArray(products)) products=DEFAULT_PRODUCTS;

let storedCategories=JSON.parse(localStorage.getItem("stock_categories_v1")||"null");
let storedUnits=JSON.parse(localStorage.getItem("stock_units_v1")||"null");

let customCategories=Array.from(new Set([...(Array.isArray(storedCategories)?storedCategories:DEFAULT_CATEGORIES),...products.map(p=>p.category).filter(Boolean),"Autre"]));
let customUnits=Array.from(new Set([...(Array.isArray(storedUnits)?storedUnits:DEFAULT_UNITS),...products.map(p=>p.unit).filter(Boolean)]));

let activeCategory="Tous";
let reorderOnly=false;

const $=id=>document.getElementById(id);
const saveProducts=()=>localStorage.setItem("stock_products_v1",JSON.stringify(products));
const saveCategories=()=>localStorage.setItem("stock_categories_v1",JSON.stringify(customCategories));
const saveUnits=()=>localStorage.setItem("stock_units_v1",JSON.stringify(customUnits));

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function statusFor(p){if(+p.qty<=0)return["Rupture","critical"];if(+p.qty<=+p.threshold)return["À recommander","low"];return["OK","ok"]}
function categories(){return["Tous",...customCategories]}

function fillSelect(selectId,items,selected){
  const sel=$(selectId);sel.innerHTML="";
  items.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;if(v===selected)o.selected=true;sel.appendChild(o)});
}

function renderFilters(){
  $("filters").innerHTML="";
  categories().forEach(c=>{
    const b=document.createElement("button");
    b.textContent=c;b.className=c===activeCategory?"active":"";
    b.onclick=()=>{activeCategory=c;reorderOnly=false;render()};
    $("filters").appendChild(b);
  });
}

function renderManager(kind){
  const isCat=kind==="category";
  const items=isCat?customCategories:customUnits;
  const list=$(isCat?"categoryList":"unitList");
  list.innerHTML="";
  items.forEach(v=>{
    const count=products.filter(p=>(isCat?p.category:p.unit)===v).length;
    const row=document.createElement("div");row.className="card";
    row.innerHTML=`<div class="row"><div><div class="name">${escapeHtml(v)}</div><div class="meta">${count} produit${count===1?"":"s"}</div></div></div>
      <div class="actions"><button data-act="rename">Renommer</button>
      ${(isCat&&v==="Autre")?"":'<button data-act="delete" class="danger">Supprimer</button>'}</div>`;

    row.querySelector('[data-act="rename"]').onclick=()=>{
      const next=prompt(`Nouveau nom ${isCat?"de la catégorie":"de l’unité"} :`,v);
      if(!next)return;
      const clean=next.trim();
      if(!clean||clean===v)return;
      if(items.includes(clean)){alert("Ce nom existe déjà.");return}
      if(isCat){
        products.forEach(p=>{if(p.category===v)p.category=clean});
        customCategories=customCategories.map(x=>x===v?clean:x);
        if(activeCategory===v)activeCategory=clean;
        saveCategories();
      }else{
        products.forEach(p=>{if(p.unit===v)p.unit=clean});
        customUnits=customUnits.map(x=>x===v?clean:x);
        saveUnits();
      }
      saveProducts();renderManager(kind);render();
    };

    const del=row.querySelector('[data-act="delete"]');
    if(del)del.onclick=()=>{
      if(count>0){
        if(isCat){
          if(!confirm(`Supprimer "${v}" ? Les ${count} produit${count===1?"":"s"} seront déplacés vers "Autre".`))return;
          products.forEach(p=>{if(p.category===v)p.category="Autre"});
        }else{
          alert(`Cette unité est utilisée par ${count} produit${count===1?"":"s"}. Renomme-la ou modifie d’abord ces produits.`);
          return;
        }
      }else if(!confirm(`Supprimer "${v}" ?`)) return;

      if(isCat){
        customCategories=customCategories.filter(x=>x!==v);
        if(!customCategories.includes("Autre"))customCategories.push("Autre");
        if(activeCategory===v)activeCategory="Tous";
        saveCategories();
      }else{
        customUnits=customUnits.filter(x=>x!==v);
        saveUnits();
      }
      saveProducts();renderManager(kind);render();
    };
    list.appendChild(row);
  });
}

function render(){
  renderFilters();
  const q=$("search").value.trim().toLowerCase();
  const filtered=products.filter(p=>
    (activeCategory==="Tous"||p.category===activeCategory)&&
    (!q||p.name.toLowerCase().includes(q)||(p.supplier||"").toLowerCase().includes(q))&&
    (!reorderOnly||+p.qty<=+p.threshold)
  );
  const low=products.filter(p=>+p.qty<=+p.threshold);

  $("totalProducts").textContent=products.length;
  $("lowCount").textContent=low.length;
  $("totalUnits").textContent=products.reduce((s,p)=>s+Number(p.qty||0),0).toFixed(0);
  $("alertPill").textContent=low.length+(low.length===1?" alerte":" alertes");
  $("reorderBox").style.display=low.length?"block":"none";
  $("reorderText").textContent=low.map(p=>`${p.name}: commander ${Math.max(0,+p.target-+p.qty)} ${p.unit}(s)`).join(" • ");

  const list=$("productList");list.innerHTML="";
  if(!filtered.length){list.innerHTML='<div class="empty">Aucun produit à afficher.</div>';return}

  filtered.sort((a,b)=>((+a.qty<=+a.threshold)?0:1)-((+b.qty<=+b.threshold)?0:1)||a.name.localeCompare(b.name))
  .forEach(p=>{
    const [label,cls]=statusFor(p),need=Math.max(0,+p.target-+p.qty);
    const card=document.createElement("div");card.className="card";
    card.innerHTML=`<div class="row"><div><div class="name">${escapeHtml(p.name)}</div>
      <div class="meta">${escapeHtml(p.category)}${p.supplier?" • "+escapeHtml(p.supplier):""}</div>
      <span class="status ${cls}">${label}</span></div>
      <div class="qty">${p.qty} ${escapeHtml(p.unit)}${(+p.qty>1 && !p.unit.endsWith("s"))?"s":""}</div></div>
      <div class="meta" style="margin-top:8px">Seuil : ${p.threshold} • Stock idéal : ${p.target}${need>0?` • À commander : ${need}`:""}</div>
      <div class="actions"><button data-act="minus">−1</button><button data-act="plus">+1</button>
      <button data-act="edit">Modifier</button><button data-act="delete" class="danger">Supprimer</button></div>`;
    card.querySelector('[data-act="minus"]').onclick=()=>adjust(p.id,-1);
    card.querySelector('[data-act="plus"]').onclick=()=>adjust(p.id,1);
    card.querySelector('[data-act="edit"]').onclick=()=>openEdit(p.id);
    card.querySelector('[data-act="delete"]').onclick=()=>removeProduct(p.id);
    list.appendChild(card);
  });
}

function adjust(id,d){
  const p=products.find(x=>x.id===id);if(!p)return;
  p.qty=Math.max(0,+p.qty+d);saveProducts();render();
}
function removeProduct(id){
  const p=products.find(x=>x.id===id);
  if(p&&confirm(`Supprimer "${p.name}" ?`)){products=products.filter(x=>x.id!==id);saveProducts();render()}
}
function openAdd(){
  $("productForm").reset();$("editId").value="";
  $("qty").value=0;$("threshold").value=3;$("target").value=10;
  fillSelect("category",customCategories,customCategories[0]||"Autre");
  fillSelect("unit",customUnits,customUnits[0]||"pièce");
  $("dialogTitle").textContent="Ajouter un produit";
  $("productDialog").showModal();
}
function openEdit(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  $("editId").value=p.id;$("name").value=p.name;
  fillSelect("category",customCategories,p.category);
  fillSelect("unit",customUnits,p.unit);
  $("category").value=p.category;$("unit").value=p.unit;$("qty").value=p.qty;
  $("threshold").value=p.threshold;$("target").value=p.target;$("supplier").value=p.supplier||"";
  $("dialogTitle").textContent="Modifier le produit";
  $("productDialog").showModal();
}

$("productForm").addEventListener("submit",e=>{
  e.preventDefault();
  const data={id:$("editId").value||crypto.randomUUID(),name:$("name").value.trim(),category:$("category").value,
    unit:$("unit").value,qty:+$("qty").value,threshold:+$("threshold").value,target:+$("target").value,supplier:$("supplier").value.trim()};
  const i=products.findIndex(p=>p.id===data.id);if(i>=0)products[i]=data;else products.push(data);
  saveProducts();$("productDialog").close();render();
});

$("cancelBtn").onclick=()=>$("productDialog").close();
$("addBtn").onclick=openAdd;
$("search").addEventListener("input",render);
$("showReorder").onclick=()=>{reorderOnly=!reorderOnly;activeCategory="Tous";$("showReorder").textContent=reorderOnly?"Voir tout":"Voir à commander";render()};

$("manageCategories").onclick=()=>{renderManager("category");$("newCategoryName").value="";$("categoryDialog").showModal()};
$("manageUnits").onclick=()=>{renderManager("unit");$("newUnitName").value="";$("unitDialog").showModal()};
$("closeCategoryDialog").onclick=()=>$("categoryDialog").close();
$("closeUnitDialog").onclick=()=>$("unitDialog").close();

$("addCategoryBtn").onclick=()=>{
  const clean=$("newCategoryName").value.trim();if(!clean)return;
  if(customCategories.includes(clean)){alert("Cette catégorie existe déjà.");return}
  customCategories.push(clean);saveCategories();$("newCategoryName").value="";renderManager("category");render();
};
$("addUnitBtn").onclick=()=>{
  const clean=$("newUnitName").value.trim();if(!clean)return;
  if(customUnits.includes(clean)){alert("Cette unité existe déjà.");return}
  customUnits.push(clean);saveUnits();$("newUnitName").value="";renderManager("unit");
};

$("newCategoryName").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("addCategoryBtn").click()}});
$("newUnitName").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("addUnitBtn").click()}});

$("exportBtn").onclick=()=>{
  const rows=[["Produit","Catégorie","Quantité","Unité","Seuil","Stock idéal","À commander","Fournisseur"]];
  products.forEach(p=>rows.push([p.name,p.category,p.qty,p.unit,p.threshold,p.target,Math.max(0,+p.target-+p.qty),p.supplier||""]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="stock_reapprovisionnement.csv";a.click();URL.revokeObjectURL(url);
};

saveCategories();saveUnits();render();

if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
}
</script>
</body>
</html>
